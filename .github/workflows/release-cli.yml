name: Release CLI

on:
  push:
    tags: ['cli-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go/go.mod'

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#cli-v}" >> $GITHUB_OUTPUT

      - name: Build binaries
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          for GOOS in linux darwin windows; do
            for GOARCH in amd64 arm64; do
              EXT=""
              if [ "$GOOS" = "windows" ]; then
                EXT=".exe"
              fi
              OUTPUT="dist/cadreen_${GOOS}_${GOARCH}${EXT}"
              echo "Building $OUTPUT..."
              CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build \
                -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                -o "$OUTPUT" \
                ./cmd/cadreen
            done
          done

      - name: Create checksums
        run: |
          cd dist
          for f in *; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "Cadreen CLI v${{ steps.version.outputs.VERSION }}"
          body: |
            ## Cadreen CLI v${{ steps.version.outputs.VERSION }}

            ### Installation

            **macOS/Linux (curl):**
            ```
            curl -fsSL https://raw.githubusercontent.com/timothy-billingrails/cadreen-sdks/main/install.sh | sh
            ```

            **Homebrew:**
            ```
            brew tap timothy-billingrails/cadreen-sdks
            brew install cadreen
            ```

            **npm:**
            ```
            npm install -g @cadreen/cli
            ```

            **Go:**
            ```
            go install github.com/timothy-billingrails/cadreen-sdks/go/cmd/cadreen@latest
            ```
          files: go/dist/*
          draft: false
          prerelease: false

      - name: Update Homebrew formula with SHA256
        run: |
          cd ..
          ARM64_DARWIN=$(cat go/dist/cadreen_darwin_arm64.sha256 | awk '{print $1}')
          AMD64_DARWIN=$(cat go/dist/cadreen_darwin_amd64.sha256 | awk '{print $1}')
          ARM64_LINUX=$(cat go/dist/cadreen_linux_arm64.sha256 | awk '{print $1}')
          AMD64_LINUX=$(cat go/dist/cadreen_linux_amd64.sha256 | awk '{print $1}')

          sed -i "s/PLACEHOLDER_ARM64_DARWIN_SHA256/${ARM64_DARWIN}/" homebrew-cadreen/cadreen.rb
          sed -i "s/PLACEHOLDER_AMD64_DARWIN_SHA256/${AMD64_DARWIN}/" homebrew-cadreen/cadreen.rb
          sed -i "s/PLACEHOLDER_ARM64_LINUX_SHA256/${ARM64_LINUX}/" homebrew-cadreen/cadreen.rb
          sed -i "s/PLACEHOLDER_AMD64_LINUX_SHA256/${AMD64_LINUX}/" homebrew-cadreen/cadreen.rb

          sed -i "s/version \".*\"/version \"${{ steps.version.outputs.VERSION }}\"/" homebrew-cadreen/cadreen.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout master
          git add homebrew-cadreen/cadreen.rb
          git diff --cached --quiet || git commit -m "chore: update Homebrew formula SHA256 for v${{ steps.version.outputs.VERSION }}"
          git push origin master
