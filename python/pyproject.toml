[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cadreen-sdk"
version = "0.6.2"
description = "Python SDK for Cadreen — intelligence-native automation infrastructure"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "httpx>=0.25",
    "httpx-sse>=0.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["cadreen"]
